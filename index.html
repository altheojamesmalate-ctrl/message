<style>

.btn:hover { transform: translateY(-2px) scale(1.03); }

.btn.primary { background: linear-gradient(135deg, color-mix(in srgb, var(--lamp) 55%, transparent), color-mix(in srgb, var(--violet) 48%, transparent)); animation: pulse 2.8s ease-in-out infinite; }

.orn { width: 44px; height: 2px; margin: 4px auto 22px; border-radius: 99px; background: linear-gradient(90deg, transparent, var(--lamp), transparent); box-shadow: 0 0 14px rgba(246, 217, 160, .7); animation: rise .8s .05s both; }

.bar i { display: block; height: 100%; width: var(--p, 0%); border-radius: inherit; background: #fff; box-shadow: 0 0 10px rgba(255, 255, 255, .8); transition: width .6s cubic-bezier(.3, 1, .4, 1); }
.cnt { font-size: 11px; letter-spacing: .12em; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

.overlay {
  position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(11, 16, 32, .55);

label.f { display: block; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--lamp); margin: 0 0 6px; }

      <animate attributeName="baseFrequency" dur="12s" values="0.012 0.02;0.02 0.012;0.012 0.02" repeatCount="indefinite"/>

        <button class="chip" type="button" aria-pressed="false" data-v="I need a little time">I need a little time</button>

</div>

  ];

  var cv = document.getElementById("fx"), cx = cv.getContext("2d"), W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2), P = [], mode = "words";

  var overlay = document.getElementById("replyOverlay"), msg = document.getElementById("msg"), nm = document.getElementById("nm"),
